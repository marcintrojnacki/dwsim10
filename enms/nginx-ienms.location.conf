        # ---- DWSIM MCP: pobieranie plików schematów (dwsim10, enms/README.md) ----
        # Pliki zapisane przez serwer w /data; kontener dwsim-mcp-pliki sprawdza ten sam token. Tylko sieć firmy.
        location /dwsim-mcp/pliki/ {
            auth_request off;
            allow 10.14.0.0/16;
            allow 10.24.0.0/16;
            deny  all;

            set $upstream_dwsim_pliki dwsim-mcp-pliki:8080;
            rewrite ^/dwsim-mcp/pliki/(.*) /pliki/$1 break;
            proxy_pass         http://$upstream_dwsim_pliki;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   Authorization     $http_authorization;
            proxy_set_header   X-MCP-Token       $http_x_mcp_token;
            limit_except GET HEAD { deny all; }
            proxy_read_timeout 120s;
        }

        # ---- DWSIM MCP (dwsim10, enms/README.md) ----
        # Tylko z sieci firmy (10.14/16, 10.24/16), bez bramy logowania: klientami są programy (skill AEE,
        # aplikacje), a każde żądanie musi nieść token serwera (Authorization: Bearer, sprawdza aplikacja).
        # Adres: https://i.enms.pl/dwsim-mcp/mcp (JSON-RPC), /sse, /health.
        location /dwsim-mcp/ {
            auth_request off;
            allow 10.14.0.0/16;
            allow 10.24.0.0/16;
            deny  all;

            set $upstream_dwsim_mcp dwsim-mcp:5901;
            rewrite ^/dwsim-mcp/(.*) /$1 break;
            proxy_pass         http://$upstream_dwsim_mcp;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Authorization     $http_authorization;
            proxy_set_header   X-MCP-Token       $http_x_mcp_token;
            proxy_set_header   Connection        "";
            # SSE i długie rozwiązania schematów
            proxy_buffering      off;
            proxy_read_timeout   600s;
            proxy_send_timeout   60s;
            client_max_body_size 8m;
        }

