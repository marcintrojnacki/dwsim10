# Staging (.122): serwer DWSIM MCP budowany ze źródeł tego repozytorium (enms/Dockerfile).
#   docker compose -f docker-compose.staging.yml up -d --build --remove-orphans
services:
  dwsim-mcp:
    build:
      context: .
      dockerfile: enms/Dockerfile
    image: dwsim-mcp:staging
    container_name: staging-dwsim-mcp
    restart: unless-stopped
    # Tylko loopback; aplikacje sięgają przez sieć `proxy` (http://staging-dwsim-mcp:5901), z zewnątrz nginx.
    ports:
      - "127.0.0.1:${PORT:-5911}:5901"
    env_file: .env            # DWSIM_MCP_TOKEN
    # Serwer nie ogranicza ścieżek zapisu: system plików tylko do odczytu, zapis wyłącznie do /data i /tmp.
    read_only: true
    volumes:
      - dwsim_mcp_data:/data
    tmpfs:
      - /tmp:size=512m,mode=1777
      - /home/dwsim:size=64m,uid=10001,gid=10001,mode=0700
    networks:
      - staging-proxy
    stop_grace_period: 30s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Pobieranie plików schematów z /data (serwer MCP nie ma takiego narzędzia). Ten sam token; z zewnątrz przez nginx
  # https://i.enms.pl/dwsim-mcp/pliki/<plik>. nginx bez roota, wolumen tylko do odczytu, bez listowania katalogu.
  dwsim-mcp-pliki:
    image: nginxinc/nginx-unprivileged:1.29-alpine
    container_name: staging-dwsim-mcp-pliki
    restart: unless-stopped
    env_file: .env            # DWSIM_MCP_TOKEN
    read_only: true
    volumes:
      - dwsim_mcp_data:/data:ro
      - ./enms/pliki/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./enms/pliki/00-wymagaj-tokenu.sh:/docker-entrypoint.d/00-wymagaj-tokenu.sh:ro
    tmpfs:
      - /tmp:size=16m
      - /etc/nginx/conf.d:size=1m,uid=101,gid=101
    networks:
      - staging-proxy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.25"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  dwsim_mcp_data:

networks:
  staging-proxy:
    external: true
